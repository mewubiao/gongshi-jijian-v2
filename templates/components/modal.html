<dialog id="{{ id }}" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{ title }}</h3>
    <div id="{{ id }}-body" class="py-4">{{ body }}</div>
    <div class="modal-action">
      <form method="dialog">
        {% include "components/button.html" with label=close_label|default:"关闭" variant="ghost" type="submit" only %}
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>关闭</button>
  </form>
</dialog>
