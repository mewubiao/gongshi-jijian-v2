name: Go workshop MVP
on:
  push:
    paths: ['go-mvp/**', '.github/workflows/go-mvp.yml']
  pull_request:
    paths: ['go-mvp/**', '.github/workflows/go-mvp.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: workshop
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U workshop -d workshop' --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: go-mvp
    env:
      TEST_DATABASE_URL: postgres://workshop:local-ci-only@127.0.0.1:5432/workshop?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-mvp/go.mod
          cache-dependency-path: go-mvp/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: go-mvp/package-lock.json
      - run: npm ci && npm run build
      - run: make test
      - run: go build .
