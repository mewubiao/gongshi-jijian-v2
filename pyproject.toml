[project]
name = "gongshi-jijian"
version = "0.1.0"
description = "新版工时计件系统（v2）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4,<4",
    "django>=5.2.19,<5.3",
    "django-unfold==0.110.1",
    "openpyxl>=3.1.5,<3.2",
    "pyodbc>=5.2",
    "qrcode>=8.2,<9",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
    "terminal",
    "accounts",
    "config",
    "masterdata",
    "erp",
    "dispatch",
    "reporting",
    "timekeeping",
    "settlement",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "terminal",
    "accounts",
    "config",
    "masterdata",
    "erp",
    "dispatch",
    "reporting",
    "timekeeping",
    "settlement",
]
