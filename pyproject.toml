[project]
name = "gongshi-jijian"
version = "0.1.0"
description = "新版工时计件系统（v2）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.19,<5.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["config", "reporting"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["config", "reporting"]
